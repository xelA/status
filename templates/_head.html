<meta charset="utf-8"/>
<title>{{ title or 'default title' }}</title>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#14bae4"/>

<link rel="icon" type="image/png" href="{{ icon }}"/>

<meta content="{{ title or 'Title' }}" property="og:title"/>
<meta content="{{ desc or 'default description' }}" property="og:description"/>
<meta content="{{ desc or 'default description' }}" name="description"/>
<meta content="{{ icon }}" property="og:image"/>

<!-- Set the theme before first paint so there's no flash, same "theme" key as the dashboard -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark" }
  catch (e) { document.documentElement.dataset.theme = "dark" }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css?family=Montserrat:500,700|Source+Code+Pro&display=swap" rel="stylesheet"/>
<link href="/static/css/style.css" type="text/css" rel="stylesheet"/>

<script src="/static/js/chart.min.js" type="text/javascript" charset="utf-8"></script>
<script src="/static/js/main.js" type="text/javascript" charset="utf-8"></script>
